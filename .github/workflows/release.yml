name: Release

# A version tag (vX.Y.Z, made by the stack's ./version script) publishes a
# GitHub Release with the agent binaries of the supported platforms, their
# SHA-256 sums and the tag's section of CHANGELOG.md as notes. Run it by hand
# with a tag to publish a release for a tag pushed before this workflow existed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          platform="${GOOS}-${GOARCH}${GOARM:+v$GOARM}"
          name="laraplate-edge_${version}_${platform}"
          exe=laraplate-edge
          if [ "$GOOS" = windows ]; then exe=laraplate-edge.exe; fi
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X github.com/getlaraplate/laraedge/internal/version.version=${version}" \
            -o "dist/$name/$exe" ./cmd/laraplate-edge
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          version="${TAG#v}"
          # The tag's section of CHANGELOG.md: from its heading to the next one.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $TAG" > notes.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 0.x versions come before the first public release: pre-releases.
          prerelease=()
          if [[ "$TAG" == v0.* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "laraplate-edge $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "${prerelease[@]}"
