# Bootstrap of the plugin pipeline demo. Run from this directory, after
# building the three plugins and pinning their hashes (README.md):
#
#   laraplate-edge run --bootstrap bootstrap.yaml
#
# No token is needed: the only output is the jsonl plugin, which writes to a
# local file. The disk buffer and the applied configuration go under ./data
# (ignored by git). The status endpoint binds its default, 127.0.0.1:9180.

agent_id: plugin-line-demo-01

config:
  provider: file
  file: config.yaml

data_dir: ./data
