# Configuration document of the simulated demo: one simulated input with two
# presses, sent to a Laraplate running on this machine. The scenario file is
# resolved against the directory of this file. The token is read from the
# environment of the agent: export LARAPLATE_EDGE_TOKEN before running it.

schema: laraplate-edge-config/1
version: 1

inputs:
  - id: press-line
    driver: simulated
    connection:
      scenario_file: scenario.yaml
      seed: 42
    devices:
      - device: press-07
        points: &press_points
          - {signal: state, address: state, type: string, read: subscribe, priority: critical}
          - {signal: good_count, address: good_count, type: uint32, unit: pcs, read: subscribe, priority: critical}
          - {signal: scrap_count, address: scrap_count, type: uint32, unit: pcs, read: subscribe, priority: critical}
          - {signal: press_force, address: press_force, type: float64, unit: kN, read: subscribe, priority: bulk}
          - {signal: die_temperature, address: die_temperature, type: float64, unit: C, read: subscribe, priority: bulk}
      - device: press-08
        points: *press_points
      # A point may carry a transform chain, applied in order before the
      # value is sent (docs/CONFIGURATION.md, "Transforms"). For example, the
      # state as an integer code, and the force in N, sent only when it moves
      # by at least 2000 N, and at least every 5 minutes:
      #
      #   - {signal: state_code, address: state, type: string, read: subscribe, priority: critical,
      #      transforms: [{map: {table: {idle: 0, running: 1, setup: 2, fault: 3}}}]}
      #   - {signal: press_force_n, address: press_force, type: float64, unit: N, read: subscribe, priority: bulk,
      #      transforms: [{scale: 1000}, {deadband: 2000}, {heartbeat: 5m}]}
      #
      # Try a chain offline on recorded samples:
      #   laraplate-edge probe press-line --config config.yaml --record samples.jsonl
      #   laraplate-edge config test config.yaml --input samples.jsonl

outputs:
  - id: laraplate
    type: laraplate-http
    url: http://127.0.0.1:8000
    token: secret://env/LARAPLATE_EDGE_TOKEN
