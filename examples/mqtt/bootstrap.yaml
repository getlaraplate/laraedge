# Bootstrap of the MQTT demo. Run from this directory:
#
#   export LARAPLATE_EDGE_TOKEN=...
#   laraplate-edge run --bootstrap bootstrap.yaml
#
# The disk buffer, the applied configuration and the subscription set of the
# mqtt input go under ./data (ignored by git). The status endpoint binds its
# default, 127.0.0.1:9180. The agent_id forms the default MQTT client id,
# laraplate-edge-<agent_id>-<input_id>, which must be unique on the broker.

agent_id: mqtt-demo-01

config:
  provider: file
  file: config.yaml

data_dir: ./data
