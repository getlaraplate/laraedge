# Bootstrap of the simulated-counter plugin demo. Run from this directory,
# after building the plugin and pinning its hashes (README.md):
#
#   export LARAPLATE_EDGE_TOKEN=...
#   laraplate-edge run --bootstrap bootstrap.yaml
#
# The disk buffer and the applied configuration go under ./data (ignored by
# git). The status endpoint binds its default, 127.0.0.1:9180.

agent_id: simulated-counter-demo-01

config:
  provider: file
  file: config.yaml

data_dir: ./data
